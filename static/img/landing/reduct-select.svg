<svg xmlns="http://www.w3.org/2000/svg" class="rs-diagram" viewBox="-2 0 764 262" width="100%" height="100%" role="img" aria-label="JSON logs, CSV telemetry, Parquet tables and Protobuf events stored in ReductStore are queried with DataFusion SQL by ReductSelect and exported as Parquet batched by time, CSV batched by rows, or computed labels."><defs><style>
:root{--rs-card-bg:#FFFFFF;--rs-card-stroke:#DAD4E0;--rs-brand:#2B0548;--rs-accent:#2B0548;
--rs-halo:rgba(43,5,72,.05);--rs-inner:#FBF9FC;--rs-text-main:#333333;--rs-text-muted:#707070;--rs-wire:#B8AEC3;--rs-boxline:#C4B2D4}
[data-theme='dark']{--rs-card-bg:#1E1E1E;--rs-card-stroke:#3A3440;--rs-accent:#BFA6DC;
--rs-halo:rgba(205,184,230,.07);--rs-inner:#232026;--rs-text-main:#EFEFEF;--rs-text-muted:#A0A0A0;--rs-wire:#6E6478;--rs-boxline:#5C4F69}
:where(.rs-diagram) text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.rs-mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.rs-card{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.5}
.rs-halo{fill:var(--rs-halo)}
.rs-box{fill:var(--rs-inner);stroke:var(--rs-boxline);stroke-width:1.5;stroke-dasharray:6 5}
.rs-pill{fill:var(--rs-brand)}
.rs-chip{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.2}
.rs-t{font-weight:600;font-size:15px;fill:var(--rs-text-main)}
.rs-bt{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-pt{font-weight:600;font-size:15px;fill:#FFFFFF}
.rs-s{font-size:12.5px;fill:var(--rs-text-muted)}
.rs-wire{fill:none;stroke:var(--rs-wire);stroke-width:1.5;stroke-dasharray:4 6;stroke-linecap:round}
.rs-flow-in{animation:rs-flow 1.6s linear infinite}
.rs-flow-rep{stroke:var(--rs-accent);stroke-width:2;animation:rs-flow 1.6s linear infinite}
.rs-bl{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-small{font-size:12px;font-weight:600}
.rs-big{font-size:26px}
.rs-static{animation:none}
.rs-logo{fill:var(--rs-accent)}
.rs-head{font-size:15px;fill:var(--rs-text-muted)}
.rs-coral{fill:#DB817B}
.rs-cchip{fill:none;stroke:#FFFFFF;stroke-opacity:.7;stroke-width:1.2}
.rs-ct{font-weight:600;font-size:14px;fill:#FFFFFF}
.rs-cs{font-size:12.5px;fill:#FFFFFF}
.rs-cap{font-size:13px;font-style:italic;fill:var(--rs-text-muted)}
.rs-si{font-size:12.5px;fill:#D9CCE6}
.rs-flow-out{animation:rs-flow 1.6s linear infinite}
[data-theme='dark'] .rs-pill{fill:#CDB8E6}
[data-theme='dark'] .rs-pill+.rs-pt{fill:#2B0548}
@keyframes rs-flow{to{stroke-dashoffset:-20}}
.rs-port{fill:var(--rs-card-bg);stroke:var(--rs-wire);stroke-width:1.5}
@media (prefers-reduced-motion: reduce){.rs-flow-in,.rs-flow-out,.rs-flow-rep{animation:none}}
</style></defs><path d="M180,34 C220,34 230,130 270,130" class="rs-wire rs-flow-in"/>
<path d="M180,92 C220,92 230,130 270,130" class="rs-wire rs-flow-in"/>
<path d="M180,150 C220,150 230,130 270,130" class="rs-wire rs-flow-in"/>
<path d="M180,208 C220,208 230,130 270,130" class="rs-wire rs-flow-in"/>
<path d="M490,130 C530,130 540,72 580,72" class="rs-wire rs-flow-out"/>
<path d="M490,130 C530,130 540,130 580,130" class="rs-wire rs-flow-out"/>
<path d="M490,130 C530,130 540,188 580,188" class="rs-wire rs-flow-out"/>
<rect x="0.0" y="12.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="20.0" y="39.0" class="rs-t" text-anchor="start" xml:space="preserve">JSON</text>
<text x="162.0" y="39.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">logs</text>
<rect x="0.0" y="70.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="20.0" y="97.0" class="rs-t" text-anchor="start" xml:space="preserve">CSV</text>
<text x="162.0" y="97.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">telemetry</text>
<rect x="0.0" y="128.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="20.0" y="155.0" class="rs-t" text-anchor="start" xml:space="preserve">Parquet</text>
<text x="162.0" y="155.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">tables</text>
<rect x="0.0" y="186.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="20.0" y="213.0" class="rs-t" text-anchor="start" xml:space="preserve">Protobuf</text>
<text x="162.0" y="213.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">events</text>
<rect x="580.0" y="50.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="600.0" y="77.0" class="rs-t" text-anchor="start" xml:space="preserve">Parquet</text>
<text x="742.0" y="77.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">by time</text>
<rect x="580.0" y="108.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="600.0" y="135.0" class="rs-t" text-anchor="start" xml:space="preserve">CSV</text>
<text x="742.0" y="135.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">by rows</text>
<rect x="580.0" y="166.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="600.0" y="193.0" class="rs-t" text-anchor="start" xml:space="preserve">Labels</text>
<text x="742.0" y="193.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">@temp</text>
<rect x="256.0" y="36.0" width="248.0" height="188.0" rx="36" class="rs-halo"/>
<rect x="270.0" y="50.0" width="220.0" height="160.0" rx="24" class="rs-card"/>
<rect x="286.0" y="66.0" width="188.0" height="50.0" rx="18" class="rs-coral"/>
<text x="380.0" y="88.0" class="rs-ct" text-anchor="middle" xml:space="preserve">ReductSelect</text>
<text x="380.0" y="106.0" class="rs-cs rs-mono" text-anchor="middle" xml:space="preserve">DataFusion SQL</text>
<text x="298.0" y="146.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">SELECT AVG(temp)</text>
<text x="298.0" y="166.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">  AS temp</text>
<text x="298.0" y="186.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">FROM ENTRY()</text>
<text x="380.0" y="22.0" class="rs-bl" text-anchor="middle" xml:space="preserve">inside ReductStore</text>
<circle cx="270.0" cy="130.0" r="5" class="rs-port"/>
<circle cx="490.0" cy="130.0" r="5" class="rs-port"/></svg>
