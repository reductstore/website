<svg xmlns="http://www.w3.org/2000/svg" class="rs-diagram" viewBox="-4 0 368 564" width="100%" height="100%" role="img" aria-label="JSON logs, CSV telemetry, Parquet tables and Protobuf events stored in ReductStore are queried with DataFusion SQL by ReductSelect and exported as Parquet batched by time, CSV batched by rows, or computed labels."><defs><style>
:root{--rs-card-bg:#FFFFFF;--rs-card-stroke:#DAD4E0;--rs-brand:#2B0548;--rs-accent:#2B0548;
--rs-halo:rgba(43,5,72,.05);--rs-inner:#FBF9FC;--rs-text-main:#333333;--rs-text-muted:#707070;--rs-wire:#B8AEC3;--rs-boxline:#C4B2D4}
[data-theme='dark']{--rs-card-bg:#1E1E1E;--rs-card-stroke:#3A3440;--rs-accent:#BFA6DC;
--rs-halo:rgba(205,184,230,.07);--rs-inner:#232026;--rs-text-main:#EFEFEF;--rs-text-muted:#A0A0A0;--rs-wire:#6E6478;--rs-boxline:#5C4F69}
:where(.rs-diagram) text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.rs-mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.rs-card{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.5}
.rs-halo{fill:var(--rs-halo)}
.rs-box{fill:var(--rs-inner);stroke:var(--rs-boxline);stroke-width:1.5;stroke-dasharray:6 5}
.rs-pill{fill:var(--rs-brand)}
.rs-chip{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.2}
.rs-t{font-weight:600;font-size:15px;fill:var(--rs-text-main)}
.rs-bt{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-pt{font-weight:600;font-size:15px;fill:#FFFFFF}
.rs-s{font-size:12.5px;fill:var(--rs-text-muted)}
.rs-wire{fill:none;stroke:var(--rs-wire);stroke-width:1.5;stroke-dasharray:4 6;stroke-linecap:round}
.rs-flow-in{animation:rs-flow 1.6s linear infinite}
.rs-flow-rep{stroke:var(--rs-accent);stroke-width:2;animation:rs-flow 1.6s linear infinite}
.rs-bl{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-small{font-size:12px;font-weight:600}
.rs-big{font-size:26px}
.rs-static{animation:none}
.rs-logo{fill:var(--rs-accent)}
.rs-head{font-size:15px;fill:var(--rs-text-muted)}
.rs-coral{fill:#DB817B}
.rs-cchip{fill:none;stroke:#FFFFFF;stroke-opacity:.7;stroke-width:1.2}
.rs-ct{font-weight:600;font-size:14px;fill:#FFFFFF}
.rs-cs{font-size:12.5px;fill:#FFFFFF}
.rs-cap{font-size:13px;font-style:italic;fill:var(--rs-text-muted)}
.rs-si{font-size:12.5px;fill:#D9CCE6}
.rs-flow-out{animation:rs-flow 1.6s linear infinite}
[data-theme='dark'] .rs-pill{fill:#CDB8E6}
[data-theme='dark'] .rs-pill+.rs-pt{fill:#2B0548}
@keyframes rs-flow{to{stroke-dashoffset:-20}}
.rs-port{fill:var(--rs-card-bg);stroke:var(--rs-wire);stroke-width:1.5}
@media (prefers-reduced-motion: reduce){.rs-flow-in,.rs-flow-out,.rs-flow-rep{animation:none}}
</style></defs><path d="M180.0,132 L180.0,174" class="rs-wire rs-flow-in"/>
<path d="M180.0,362 L180.0,402" class="rs-wire rs-flow-out"/>
<rect x="-2.0" y="0.0" width="364.0" height="132.0" rx="28" class="rs-halo"/>
<rect x="12.0" y="14.0" width="164.0" height="44.0" rx="22" class="rs-card"/>
<text x="32.0" y="41.0" class="rs-t" text-anchor="start" xml:space="preserve">JSON</text>
<text x="158.0" y="41.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">logs</text>
<rect x="184.0" y="14.0" width="164.0" height="44.0" rx="22" class="rs-card"/>
<text x="204.0" y="41.0" class="rs-t" text-anchor="start" xml:space="preserve">CSV</text>
<text x="330.0" y="41.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">telemetry</text>
<rect x="12.0" y="70.0" width="164.0" height="44.0" rx="22" class="rs-card"/>
<text x="32.0" y="97.0" class="rs-t" text-anchor="start" xml:space="preserve">Parquet</text>
<text x="158.0" y="97.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">tables</text>
<rect x="184.0" y="70.0" width="164.0" height="44.0" rx="22" class="rs-card"/>
<text x="204.0" y="97.0" class="rs-t" text-anchor="start" xml:space="preserve">Protobuf</text>
<text x="330.0" y="97.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">events</text>
<circle cx="180.0" cy="132.0" r="5" class="rs-port"/>
<circle cx="180.0" cy="174.0" r="5" class="rs-port"/>
<rect x="56.0" y="174.0" width="248.0" height="188.0" rx="36" class="rs-halo"/>
<rect x="70.0" y="188.0" width="220.0" height="160.0" rx="24" class="rs-card"/>
<rect x="86.0" y="204.0" width="188.0" height="50.0" rx="18" class="rs-coral"/>
<text x="180.0" y="226.0" class="rs-ct" text-anchor="middle" xml:space="preserve">ReductSelect</text>
<text x="180.0" y="244.0" class="rs-cs rs-mono" text-anchor="middle" xml:space="preserve">DataFusion SQL</text>
<text x="98.0" y="284.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">SELECT AVG(temp)</text>
<text x="98.0" y="304.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">  AS temp</text>
<text x="98.0" y="324.0" class="rs-s rs-mono" text-anchor="start" xml:space="preserve">FROM ENTRY()</text>
<circle cx="180.0" cy="362.0" r="5" class="rs-port"/>
<rect x="70.0" y="402.0" width="220.0" height="44.0" rx="22" class="rs-card"/>
<text x="90.0" y="429.0" class="rs-t" text-anchor="start" xml:space="preserve">Parquet</text>
<text x="272.0" y="429.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">by time</text>
<rect x="70.0" y="456.0" width="220.0" height="44.0" rx="22" class="rs-card"/>
<text x="90.0" y="483.0" class="rs-t" text-anchor="start" xml:space="preserve">CSV</text>
<text x="272.0" y="483.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">by rows</text>
<rect x="70.0" y="510.0" width="220.0" height="44.0" rx="22" class="rs-card"/>
<text x="90.0" y="537.0" class="rs-t" text-anchor="start" xml:space="preserve">Labels</text>
<text x="272.0" y="537.0" class="rs-s rs-mono" text-anchor="end" xml:space="preserve">@temp</text></svg>
