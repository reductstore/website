<rect x="10.0" y="290.0" width="180.0" height="44.0" rx="22" class="rs-card"/>
<text x="32.0" y="317.0" class="rs-t" text-anchor="start">Shell</text>
<text x="170.0" y="317.0" class="rs-s rs-mono" text-anchor="end">commands</text>
<circle cx="296.0" cy="172.0" r="5" class="rs-port"/>
<rect x="310.0" y="117.0" width="200.0" height="110.0" rx="24" class="rs-coral"/>
