<text x="138.0" y="275.0" class="rs-s rs-mono" text-anchor="end">commands</text>
<circle cx="196.0" cy="85.0" r="5" class="rs-port"/>
<rect x="210.0" y="40.0" width="140.0" height="90.0" rx="24" class="rs-coral"/>
