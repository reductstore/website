<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="10" y="10" width="740" height="145" rx="18" class="zone" />
  <rect x="10" y="185" width="740" height="180" rx="18" class="zone" />
  <text x="30" y="36" class="text-zone" text-anchor="start">Unindexed block</text>
  <rect x="35" y="65" width="260" height="56" rx="10" class="card-plain" />
  <text x="165" y="90" class="text-item" text-anchor="middle">RS_ZENOH_SUB_KEYEXPRS</text>
  <text x="165" y="109" class="text-label mono" text-anchor="middle">sensors/**</text>
  <rect x="440" y="65" width="260" height="56" rx="10" class="card-brand" />
  <text x="570" y="90" class="text-item-inverse" text-anchor="middle">One subscriber block</text>
  <text x="570" y="109" class="text-label-inverse mono" text-anchor="middle">RS_ZENOH_SUB_*</text>
  <path d="M295,93 L436,93" class="connector" marker-end="url(#arrow)" />
  <text x="30" y="211" class="text-zone" text-anchor="start">Indexed blocks</text>
  <rect x="35" y="240" width="260" height="56" rx="10" class="card-plain" />
  <text x="165" y="265" class="text-item" text-anchor="middle">RS_ZENOH_SUB_0_KEYEXPRS</text>
  <text x="165" y="284" class="text-label mono" text-anchor="middle">cameras/**</text>
  <rect x="35" y="302" width="260" height="56" rx="10" class="card-plain" />
  <text x="165" y="327" class="text-item" text-anchor="middle">RS_ZENOH_SUB_1_KEYEXPRS</text>
  <text x="165" y="346" class="text-label mono" text-anchor="middle">sensors/**</text>
  <rect x="440" y="240" width="260" height="56" rx="10" class="card-brand" />
  <text x="570" y="265" class="text-item-inverse" text-anchor="middle">Subscriber block 0</text>
  <text x="570" y="284" class="text-label-inverse mono" text-anchor="middle">RS_ZENOH_SUB_0_*</text>
  <rect x="440" y="302" width="260" height="56" rx="10" class="card-brand" />
  <text x="570" y="327" class="text-item-inverse" text-anchor="middle">Subscriber block 1</text>
  <text x="570" y="346" class="text-label-inverse mono" text-anchor="middle">RS_ZENOH_SUB_1_*</text>
  <path d="M295,268 L436,268" class="connector" marker-end="url(#arrow)" />
  <path d="M295,330 L436,330" class="connector" marker-end="url(#arrow)" />
</svg>
