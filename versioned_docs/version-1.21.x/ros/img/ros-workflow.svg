<text x="385.0" y="140.0" class="rs-ct" text-anchor="middle">ReductBridge</text>
<text x="385.0" y="166.0" class="rs-cs" text-anchor="middle">subscribes to topics</text>
<text x="385.0" y="185.0" class="rs-cs" text-anchor="middle">stores payloads</text>
<text x="385.0" y="204.0" class="rs-cs" text-anchor="middle">applies labels</text>
<text x="385.0" y="223.0" class="rs-cs" text-anchor="middle">attaches ROS schema</text>
<circle cx="480.0" cy="175.0" r="5" class="rs-port"/>
