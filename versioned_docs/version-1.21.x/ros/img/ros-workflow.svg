<text x="42.0" y="402.0" class="rs-bt" text-anchor="start">Cloud or central on-premises</text>
<rect x="331.3" y="384.0" width="137.4" height="34.0" rx="17" class="rs-pill"/>
<text x="400.0" y="406.0" class="rs-pt" text-anchor="middle">ReductStore</text>
<rect x="44.0" y="440.0" width="220.0" height="70.0" rx="16" class="rs-box"/>
