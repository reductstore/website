<svg xmlns="http://www.w3.org/2000/svg" class="rs-diagram" viewBox="0 0 800 556" width="100%" height="100%" role="img" aria-label="ROS 2 topics send serialized messages to ReductBridge, which subscribes and timestamps them, routes labels in a pipeline, and batches HTTP writes to the robot-data bucket in ReductStore, one entry per topic with CDR records and the $schema attachment."><defs><style>
:root{--rs-card-bg:#FFFFFF;--rs-card-stroke:#DAD4E0;--rs-brand:#2B0548;--rs-accent:#2B0548;
--rs-halo:rgba(43,5,72,.05);--rs-inner:#FBF9FC;--rs-text-main:#333333;--rs-text-muted:#707070;--rs-wire:#B8AEC3;--rs-boxline:#C4B2D4}
[data-theme='dark']{--rs-card-bg:#1E1E1E;--rs-card-stroke:#3A3440;--rs-accent:#BFA6DC;
--rs-halo:rgba(205,184,230,.07);--rs-inner:#232026;--rs-text-main:#EFEFEF;--rs-text-muted:#A0A0A0;--rs-wire:#6E6478;--rs-boxline:#5C4F69}
:where(.rs-diagram) text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.rs-mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.rs-card{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.5}
.rs-halo{fill:var(--rs-halo)}
.rs-box{fill:var(--rs-inner);stroke:var(--rs-boxline);stroke-width:1.5;stroke-dasharray:6 5}
.rs-pill{fill:var(--rs-brand)}
.rs-chip{fill:var(--rs-card-bg);stroke:var(--rs-card-stroke);stroke-width:1.2}
.rs-t{font-weight:600;font-size:15px;fill:var(--rs-text-main)}
.rs-bt{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-pt{font-weight:600;font-size:15px;fill:#FFFFFF}
.rs-s{font-size:12.5px;fill:var(--rs-text-muted)}
.rs-wire{fill:none;stroke:var(--rs-wire);stroke-width:1.5;stroke-dasharray:4 6;stroke-linecap:round}
.rs-flow-in{animation:rs-flow 1.6s linear infinite}
.rs-flow-rep{stroke:var(--rs-accent);stroke-width:2;animation:rs-flow 1.6s linear infinite}
.rs-bl{font-weight:600;font-size:14px;fill:var(--rs-accent)}
.rs-small{font-size:12px;font-weight:600}
.rs-big{font-size:26px}
.rs-static{animation:none}
.rs-logo{fill:var(--rs-accent)}
.rs-head{font-size:15px;fill:var(--rs-text-muted)}
.rs-coral{fill:#DB817B}
.rs-cchip{fill:none;stroke:#FFFFFF;stroke-opacity:.7;stroke-width:1.2}
.rs-ct{font-weight:600;font-size:14px;fill:#FFFFFF}
.rs-cs{font-size:12.5px;fill:#FFFFFF}
.rs-cap{font-size:13px;font-style:italic;fill:var(--rs-text-muted)}
.rs-si{font-size:12.5px;fill:#D9CCE6}
.rs-flow-out{animation:rs-flow 1.6s linear infinite}
[data-theme='dark'] .rs-pill{fill:#CDB8E6}
[data-theme='dark'] .rs-pill+.rs-pt{fill:#2B0548}
@keyframes rs-flow{to{stroke-dashoffset:-20}}
.rs-port{fill:var(--rs-card-bg);stroke:var(--rs-wire);stroke-width:1.5}
@media (prefers-reduced-motion: reduce){.rs-flow-in,.rs-flow-out,.rs-flow-rep{animation:none}}
</style><style>
.rs-line{stroke:var(--rs-card-stroke);stroke-width:1}
.rs-hl{fill:#DB817B;fill-opacity:.18}
.rs-sel{fill:var(--rs-card-bg);stroke:var(--rs-accent);stroke-width:2}
.rs-code{font-size:13px;fill:var(--rs-text-main)}
</style></defs><rect x="10" y="130" width="780" height="210" rx="32" class="rs-halo"/>
