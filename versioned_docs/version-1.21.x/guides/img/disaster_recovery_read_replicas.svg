<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -32 760 460" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="10" y="88" width="230" height="190" rx="18" class="zone" />
  <rect x="310" y="88" width="440" height="190" rx="18" class="zone" />
  <text x="28" y="114" class="text-zone" text-anchor="start">Ingestion endpoint</text>
  <rect x="42" y="156" width="166" height="74" rx="16" class="card-brand" />
  <text x="125" y="187" class="text-title-inverse" text-anchor="middle">ReductStore</text>
  <text x="125" y="211" class="text-subtitle-inverse mono" text-anchor="middle">writer</text>
  <rect x="48" y="8" width="154" height="52" rx="16" class="card-standard" />
  <text x="125" y="28" class="text-title" text-anchor="middle">Write clients</text>
  <text x="125" y="52" class="text-subtitle mono" text-anchor="middle">ingestion</text>
  <path d="M125,60 L125,156" class="connector" marker-end="url(#arrow)" />
  <rect x="496" y="8" width="204" height="52" rx="16" class="card-standard" />
  <text x="598" y="28" class="text-title" text-anchor="middle">Query endpoint</text>
  <text x="598" y="52" class="text-subtitle mono" text-anchor="middle">load balancer</text>
  <text x="330" y="114" class="text-zone" text-anchor="start">Read-only replicas</text>
  <text x="330" y="134" class="text-label mono" text-anchor="start">RS_INSTANCE_ROLE=REPLICA</text>
  <rect x="338" y="156" width="166" height="74" rx="16" class="card-brand" />
  <text x="421" y="187" class="text-title-inverse" text-anchor="middle">ReductStore</text>
  <text x="421" y="211" class="text-subtitle-inverse mono" text-anchor="middle">replica 1</text>
  <rect x="556" y="156" width="166" height="74" rx="16" class="card-brand" />
  <text x="639" y="187" class="text-title-inverse" text-anchor="middle">ReductStore</text>
  <text x="639" y="211" class="text-subtitle-inverse mono" text-anchor="middle">replica 2</text>
  <rect x="170" y="348" width="510" height="70" rx="16" class="card-accent" />
  <text x="425" y="377" class="text-title-inverse" text-anchor="middle">Shared storage</text>
  <text x="425" y="401" class="text-subtitle-inverse mono" text-anchor="middle">RS_DATA_PATH</text>
  <path d="M125,230 L125,312 L330,312 L330,348" class="connector" marker-end="url(#arrow)" />
  <text x="210" y="302" class="text-label" text-anchor="middle">writes</text>
  <path d="M421,348 L421,292 L421,230" class="link" marker-end="url(#arrow)" />
  <path d="M639,348 L639,292 L639,230" class="link" marker-end="url(#arrow)" />
  <text x="530" y="322" class="text-label" text-anchor="middle">refresh indexes</text>
  <path d="M504,193 L540,193 L540,60" class="link" marker-end="url(#arrow)" />
  <path d="M639,156 L639,60" class="link" marker-end="url(#arrow)" />
  <text x="590" y="110" class="text-label" text-anchor="middle">read traffic</text>
  <path d="M598,8 L598,-22" class="connector" marker-end="url(#arrow)" />
</svg>
