<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 20 890 360" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="0" y="110" width="290" height="190" rx="18" class="zone" />
  <rect x="400" y="110" width="180" height="190" rx="18" class="zone" />
  <rect x="690" y="30" width="180" height="340" rx="18" class="zone" />
  <text x="20" y="136" class="text-zone" text-anchor="start">Drones</text>
  <text x="84" y="181" class="text-label mono" text-anchor="end">images</text>
  <path d="M92,176 L116,176 L116,216" class="connector" />
  <text x="84" y="221" class="text-label mono" text-anchor="end">sensors</text>
  <path d="M92,216 L116,216 L116,216" class="connector" />
  <text x="84" y="261" class="text-label mono" text-anchor="end">logs</text>
  <path d="M92,256 L116,256 L116,216" class="connector" />
  <path d="M116,216 L132,216" class="connector" marker-end="url(#arrow)" />
  <rect x="136" y="186" width="136" height="60" rx="10" class="card-brand" />
  <text x="204" y="221" class="text-item-inverse" text-anchor="middle">ReductStore</text>
  <text x="420" y="136" class="text-zone" text-anchor="start">Ground Station</text>
  <rect x="422" y="186" width="136" height="60" rx="10" class="card-brand" />
  <text x="490" y="221" class="text-item-inverse" text-anchor="middle">ReductStore</text>
  <text x="710" y="56" class="text-zone" text-anchor="start">Cloud</text>
  <rect x="712" y="110" width="136" height="60" rx="10" class="card-brand" />
  <text x="780" y="145" class="text-item-inverse" text-anchor="middle">ReductStore</text>
  <path d="M780,170 L780,240" class="link" />
  <rect x="712" y="240" width="136" height="70" rx="10" class="card-accent" />
  <text x="780" y="272" class="text-item-inverse" text-anchor="middle">S3 storage</text>
  <text x="780" y="291" class="text-label-inverse" text-anchor="middle">backend</text>
  <text x="780" y="348" class="text-note" text-anchor="middle">N replicas</text>
  <path d="M302,216 L396,216" class="connector" marker-end="url(#arrow)" />
  <text x="349" y="244" class="text-note" text-anchor="middle">subset of data</text>
  <path d="M592,216 L686,216" class="connector" marker-end="url(#arrow)" />
  <text x="639" y="244" class="text-note" text-anchor="middle">subset of data</text>
</svg>
