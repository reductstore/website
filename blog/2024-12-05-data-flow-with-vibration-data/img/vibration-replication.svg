<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 760" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #8A6FA8;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="750" height="300" rx="18" class="zone" />
  <rect x="0" y="440" width="750" height="300" rx="18" class="zone" />
  <text x="20" y="26" class="text-zone" text-anchor="start">ReductStore (Cloud Server)</text>
  <text x="24" y="150" class="text-item" text-anchor="start">Replication with</text>
  <text x="24" y="172" class="text-item" text-anchor="start">reduction strategy</text>
  <text x="374" y="62" class="text-label" text-anchor="start">Label</text>
  <rect x="374" y="70" width="170" height="82" rx="10" class="card-brand" />
  <text x="390" y="94" class="text-bullet-inverse" text-anchor="start">+ RMS</text>
  <text x="390" y="116" class="text-bullet-inverse" text-anchor="start">+ Peak-to-Peak</text>
  <text x="390" y="138" class="text-bullet-inverse" text-anchor="start">+ Crest Factor</text>
  <rect x="374" y="162" width="170" height="44" rx="4" class="card-plain" />
  <rect x="374" y="162" width="170" height="44" rx="4" class="hatch" />
  <text x="459" y="230" class="text-label" text-anchor="middle">Binary chunk 2</text>
  <path d="M374,206 L374,266" class="guide" />
  <text x="374" y="284" class="text-label mono" text-anchor="middle">timestamp 2</text>
  <text x="548" y="62" class="text-label" text-anchor="start">Label</text>
  <rect x="548" y="70" width="170" height="82" rx="10" class="card-brand" />
  <text x="564" y="94" class="text-bullet-inverse" text-anchor="start">+ RMS</text>
  <text x="564" y="116" class="text-bullet-inverse" text-anchor="start">+ Peak-to-Peak</text>
  <text x="564" y="138" class="text-bullet-inverse" text-anchor="start">+ Crest Factor</text>
  <rect x="548" y="162" width="170" height="44" rx="4" class="card-plain" />
  <rect x="548" y="162" width="170" height="44" rx="4" class="hatch" />
  <text x="633" y="230" class="text-label" text-anchor="middle">Binary chunk 3</text>
  <path d="M548,206 L548,266" class="guide" />
  <text x="548" y="284" class="text-label mono" text-anchor="middle">timestamp 3</text>
  <path d="M0,380 L750,380" class="guide" />
  <text x="750" y="370" class="text-label mono" text-anchor="end">network</text>
  <path d="M459,490 L459,310" class="connector" marker-end="url(#arrow)" />
  <path d="M633,490 L633,310" class="connector" marker-end="url(#arrow)" />
  <text x="20" y="466" class="text-zone" text-anchor="start">ReductStore (Edge Server)</text>
  <text x="200" y="502" class="text-label" text-anchor="start">Label</text>
  <rect x="200" y="510" width="170" height="82" rx="10" class="card-plain" />
  <text x="216" y="534" class="text-bullet" text-anchor="start">+ RMS</text>
  <text x="216" y="556" class="text-bullet" text-anchor="start">+ Peak-to-Peak</text>
  <text x="216" y="578" class="text-bullet" text-anchor="start">+ Crest Factor</text>
  <rect x="200" y="602" width="170" height="44" rx="4" class="card-plain" />
  <rect x="200" y="602" width="170" height="44" rx="4" class="hatch" />
  <text x="285" y="670" class="text-label" text-anchor="middle">Binary chunk 1</text>
  <path d="M200,646 L200,706" class="guide" />
  <text x="200" y="724" class="text-label mono" text-anchor="middle">timestamp 1</text>
  <text x="374" y="502" class="text-label" text-anchor="start">Label</text>
  <rect x="374" y="510" width="170" height="82" rx="10" class="card-brand" />
  <text x="390" y="534" class="text-bullet-inverse" text-anchor="start">+ RMS</text>
  <text x="390" y="556" class="text-bullet-inverse" text-anchor="start">+ Peak-to-Peak</text>
  <text x="390" y="578" class="text-bullet-inverse" text-anchor="start">+ Crest Factor</text>
  <rect x="374" y="602" width="170" height="44" rx="4" class="card-plain" />
  <rect x="374" y="602" width="170" height="44" rx="4" class="hatch" />
  <text x="459" y="670" class="text-label" text-anchor="middle">Binary chunk 2</text>
  <path d="M374,646 L374,706" class="guide" />
  <text x="374" y="724" class="text-label mono" text-anchor="middle">timestamp 2</text>
  <text x="548" y="502" class="text-label" text-anchor="start">Label</text>
  <rect x="548" y="510" width="170" height="82" rx="10" class="card-brand" />
  <text x="564" y="534" class="text-bullet-inverse" text-anchor="start">+ RMS</text>
  <text x="564" y="556" class="text-bullet-inverse" text-anchor="start">+ Peak-to-Peak</text>
  <text x="564" y="578" class="text-bullet-inverse" text-anchor="start">+ Crest Factor</text>
  <rect x="548" y="602" width="170" height="44" rx="4" class="card-plain" />
  <rect x="548" y="602" width="170" height="44" rx="4" class="hatch" />
  <text x="633" y="670" class="text-label" text-anchor="middle">Binary chunk 3</text>
  <path d="M548,646 L548,706" class="guide" />
  <text x="548" y="724" class="text-label mono" text-anchor="middle">timestamp 3</text>
</svg>
