<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 92 980 172" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF; --card-brand: #2B0548; --card-stroke: #333333;
        --text-main: #333333; --text-muted: #666666; --text-inverse: #FFFFFF;
        --line: #333333; --rule: #CCCCCC;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E; --card-stroke: #555555;
          --text-main: #EFEFEF; --text-muted: #A0A0A0; --line: #EFEFEF; --rule: #444444;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand    { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .tick-brand    { fill: var(--card-brand); }
      .text-label    { font-size: 13px; fill: var(--text-muted); letter-spacing: 0.09em; }
      .label-inverse { font-size: 13px; fill: var(--text-inverse); letter-spacing: 0.09em; }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-emph     { font-size: 15px; font-weight: 600; fill: var(--text-main); }
      .mono          { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
                       font-size: 14px; fill: var(--text-main); }
      .mono-muted    { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
                       font-size: 13px; fill: var(--text-muted); }
      .mono-inverse  { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
                       font-size: 13px; fill: var(--text-inverse); }
      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .rule-inv  { stroke: #8A6DA8; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: var(--line); }
      .arrow-head-inv { fill: #8A6DA8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-inv" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-inv"/>
    </marker>
  </defs>

  <text x="20" y="118" class="text-label">CAMERA</text>
  <rect x="20" y="142" width="150" height="68" rx="8" class="card-standard"/>
  <text x="95.0" y="178" class="mono" text-anchor="middle">usb_cam</text>
  <text x="95.0" y="198" class="text-subtitle" font-size="13" text-anchor="middle">ROS 2 node</text>
  <line x1="180" y1="176" x2="360" y2="176" class="connector" marker-end="url(#arrow)"/>
  <text x="270.0" y="162" class="mono-muted" text-anchor="middle">/image_raw/compressed</text>
  <text x="370" y="118" class="text-label">YOUR NODE</text>
  <rect x="370" y="142" width="150" height="68" rx="8" class="card-standard"/>
  <text x="445.0" y="178" class="mono" text-anchor="middle">ImageListener</text>
  <text x="445.0" y="198" class="text-subtitle" font-size="13" text-anchor="middle">subscribes</text>
  <line x1="530" y1="176" x2="620" y2="176" class="connector" marker-end="url(#arrow)"/>
  <text x="575.0" y="162" class="mono-muted" text-anchor="middle">write()</text>
  <rect x="630" y="100" width="350" height="156" rx="8" class="card-brand"/>
  <text x="650" y="126" class="label-inverse">REDUCTSTORE</text>
  <text x="960" y="126" class="mono-inverse" text-anchor="end">ros-bucket</text>
  <text x="650" y="150" class="mono-inverse">entry: images</text>
  <rect x="650" y="162" width="68" height="46" rx="5" class="card-standard"/>
  <rect x="652" y="164" width="5" height="42" class="tick-brand"/>
  <text x="687.0" y="182" class="mono-muted" font-size="11" text-anchor="middle">jpeg</text>
  <text x="687.0" y="198" class="mono-muted" font-size="11" text-anchor="middle">labels</text>
  <text x="684.0" y="223" class="mono-inverse" font-size="12" text-anchor="middle">t1</text>
  <rect x="730" y="162" width="68" height="46" rx="5" class="card-standard"/>
  <rect x="732" y="164" width="5" height="42" class="tick-brand"/>
  <text x="767.0" y="182" class="mono-muted" font-size="11" text-anchor="middle">jpeg</text>
  <text x="767.0" y="198" class="mono-muted" font-size="11" text-anchor="middle">labels</text>
  <text x="764.0" y="223" class="mono-inverse" font-size="12" text-anchor="middle">t2</text>
  <rect x="810" y="162" width="68" height="46" rx="5" class="card-standard"/>
  <rect x="812" y="164" width="5" height="42" class="tick-brand"/>
  <text x="847.0" y="182" class="mono-muted" font-size="11" text-anchor="middle">jpeg</text>
  <text x="847.0" y="198" class="mono-muted" font-size="11" text-anchor="middle">labels</text>
  <text x="844.0" y="223" class="mono-inverse" font-size="12" text-anchor="middle">t3</text>
  <rect x="890" y="162" width="68" height="46" rx="5" class="card-standard"/>
  <rect x="892" y="164" width="5" height="42" class="tick-brand"/>
  <text x="927.0" y="182" class="mono-muted" font-size="11" text-anchor="middle">jpeg</text>
  <text x="927.0" y="198" class="mono-muted" font-size="11" text-anchor="middle">labels</text>
  <text x="924.0" y="223" class="mono-inverse" font-size="12" text-anchor="middle">t4</text>
  <line x1="646" y1="232" x2="966" y2="232" class="rule-inv" marker-end="url(#arrow-inv)"/>
</svg>