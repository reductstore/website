<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Robotics sensor data architecture with InfluxDB and ReductStore</title>
  <desc id="desc">Sensors feed a processing service that sends numeric metrics to InfluxDB and raw binary payloads to ReductStore. Investigation and machine learning tools query both stores by event time.</desc>
  <rect width="1200" height="630" fill="#101827"/>
  <text x="70" y="85" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="700">Robotics data: two stores, one event-time window</text>
  <text x="70" y="125" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Keep numeric metrics in InfluxDB and raw sensor payloads in ReductStore.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="230" width="230" height="180" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="185" y="285" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">Sensors</text>
    <text x="185" y="330" fill="#cbd5e1" font-size="20" text-anchor="middle">Camera, LiDAR,</text>
    <text x="185" y="358" fill="#cbd5e1" font-size="20" text-anchor="middle">waveform, telemetry</text>
    <rect x="430" y="230" width="280" height="180" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="570" y="285" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">Processing and fan-out</text>
    <text x="570" y="330" fill="#cbd5e1" font-size="20" text-anchor="middle">Event time, robot_id, sensor_id</text>
    <text x="570" y="358" fill="#cbd5e1" font-size="20" text-anchor="middle">metrics and unchanged bytes</text>
    <rect x="850" y="155" width="280" height="160" rx="16" fill="#214a67" stroke="#38bdf8" stroke-width="2"/>
    <text x="990" y="220" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">InfluxDB</text>
    <text x="990" y="262" fill="#dbeafe" font-size="20" text-anchor="middle">Metrics, aggregates, alerts</text>
    <rect x="850" y="385" width="280" height="160" rx="16" fill="#24513f" stroke="#4ade80" stroke-width="2"/>
    <text x="990" y="450" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">ReductStore</text>
    <text x="990" y="492" fill="#dcfce7" font-size="20" text-anchor="middle">Frames, scans, waveform chunks</text>
    <path d="M300 320H410M710 275H830M710 365H830" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M410 320l-14-10v20zM830 275l-14-10v20zM830 365l-14-10v20z" fill="#e2e8f0"/>
    <text x="770" y="250" fill="#bae6fd" font-size="18" text-anchor="middle">numeric metrics</text>
    <text x="770" y="400" fill="#bbf7d0" font-size="18" text-anchor="middle">raw binary payloads</text>
  </g>
</svg>
