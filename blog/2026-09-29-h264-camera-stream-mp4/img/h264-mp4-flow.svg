<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 788 234" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="200" height="214" rx="18" class="zone" />
  <rect x="588" y="0" width="180" height="214" rx="18" class="zone" />
  <text x="18" y="26" class="text-zone" text-anchor="start">Camera</text>
  <rect x="20" y="50" width="48" height="70" rx="6" class="card-plain" />
  <rect x="20" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="78" y="50" width="48" height="70" rx="6" class="card-plain" />
  <rect x="78" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="136" y="50" width="48" height="70" rx="6" class="card-plain" />
  <rect x="136" y="50" width="7" height="70" rx="3" class="card-brand" />
  <text x="20" y="150" class="text-label-strong mono" text-anchor="start">video/h264</text>
  <text x="20" y="174" class="text-label" text-anchor="start">Annex B, one keyframe</text>
  <text x="20" y="192" class="text-label" text-anchor="start">interval each</text>
  <rect x="244" y="0" width="300" height="214" rx="18" class="card-brand-frame" />
  <text x="264" y="32" class="text-title-brand" text-anchor="start">ReductStore</text>
  <rect x="264" y="50" width="44" height="70" rx="6" class="card-plain" />
  <rect x="264" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="318" y="50" width="44" height="70" rx="6" class="card-plain" />
  <rect x="318" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="372" y="50" width="44" height="70" rx="6" class="card-plain" />
  <rect x="372" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="426" y="50" width="44" height="70" rx="6" class="card-plain" />
  <rect x="426" y="50" width="7" height="70" rx="3" class="card-brand" />
  <rect x="480" y="50" width="44" height="70" rx="6" class="card-plain" />
  <rect x="480" y="50" width="7" height="70" rx="3" class="card-brand" />
  <path d="M264,138 L512,138" class="connector" marker-end="url(#arrow)" />
  <text x="520" y="142" class="text-label mono" text-anchor="start">t</text>
  <text x="264" y="174" class="text-label" text-anchor="start">time-indexed records,</text>
  <text x="264" y="192" class="text-label" text-anchor="start">capture time on each</text>
  <text x="606" y="26" class="text-zone" text-anchor="start">One query</text>
  <rect x="606" y="50" width="144" height="70" rx="10" class="card-plain" />
  <text x="678" y="82" class="text-item" text-anchor="middle">MP4</text>
  <text x="678" y="101" class="text-label mono" text-anchor="middle">video/mp4</text>
  <text x="606" y="174" class="text-label" text-anchor="start">or one episode per</text>
  <text x="606" y="192" class="text-label" text-anchor="start">limit or gap</text>
  <path d="M200,85 L240,85" class="connector" marker-end="url(#arrow)" />
  <path d="M544,85 L584,85" class="connector" marker-end="url(#arrow)" />
</svg>
