<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.3 -5 757.3 388.9" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <text x="10" y="20" class="text-zone" text-anchor="start">Records</text>
  <text x="698" y="20" class="text-label-strong mono" text-anchor="end">video/h264</text>
  <rect x="13" y="36" width="94" height="56" rx="6" class="card-plain" />
  <rect x="13" y="36" width="7" height="56" rx="3" class="card-brand" />
  <text x="63" y="69" class="text-label mono" text-anchor="middle">1s</text>
  <rect x="113" y="36" width="94" height="56" rx="6" class="card-plain" />
  <rect x="113" y="36" width="7" height="56" rx="3" class="card-brand" />
  <text x="163" y="69" class="text-label mono" text-anchor="middle">1s</text>
  <rect x="213" y="36" width="94" height="56" rx="6" class="card-plain" />
  <rect x="213" y="36" width="7" height="56" rx="3" class="card-brand" />
  <text x="263" y="69" class="text-label mono" text-anchor="middle">1s</text>
  <rect x="513" y="36" width="94" height="56" rx="6" class="card-plain" />
  <rect x="513" y="36" width="7" height="56" rx="3" class="card-brand" />
  <text x="563" y="69" class="text-label mono" text-anchor="middle">1s</text>
  <rect x="613" y="36" width="94" height="56" rx="6" class="card-plain" />
  <rect x="613" y="36" width="7" height="56" rx="3" class="card-brand" />
  <text x="663" y="69" class="text-label mono" text-anchor="middle">1s</text>
  <rect x="313" y="36" width="194" height="56" rx="6" class="zone" />
  <text x="410" y="69" class="text-note" text-anchor="middle">no records</text>
  <path d="M10,122 L740,122" class="connector" marker-end="url(#arrow)" />
  <path d="M10,116 L10,128" class="connector" />
  <text x="10" y="148" class="text-label mono" text-anchor="middle">0s</text>
  <path d="M110,116 L110,128" class="connector" />
  <text x="110" y="148" class="text-label mono" text-anchor="middle">1s</text>
  <path d="M210,116 L210,128" class="connector" />
  <text x="210" y="148" class="text-label mono" text-anchor="middle">2s</text>
  <path d="M310,116 L310,128" class="connector" />
  <text x="310" y="148" class="text-label mono" text-anchor="middle">3s</text>
  <path d="M410,116 L410,128" class="connector" />
  <text x="410" y="148" class="text-label mono" text-anchor="middle">4s</text>
  <path d="M510,116 L510,128" class="connector" />
  <text x="510" y="148" class="text-label mono" text-anchor="middle">5s</text>
  <path d="M610,116 L610,128" class="connector" />
  <text x="610" y="148" class="text-label mono" text-anchor="middle">6s</text>
  <path d="M710,116 L710,128" class="connector" />
  <text x="710" y="148" class="text-label mono" text-anchor="middle">7s</text>
  <path d="M210,96 L210,112" class="guide" />
  <path d="M210,156 L210,238" class="guide" />
  <path d="M310,96 L310,112" class="guide" />
  <path d="M310,156 L310,238" class="guide" />
  <path d="M510,96 L510,112" class="guide" />
  <path d="M510,156 L510,238" class="guide" />
  <path d="M710,96 L710,112" class="guide" />
  <path d="M710,156 L710,238" class="guide" />
  <rect x="10" y="172" width="7" height="16" rx="2" class="card-brand" />
  <text x="26" y="185" class="text-label" text-anchor="start">keyframe</text>
  <text x="10" y="222" class="text-zone" text-anchor="start">Episodes</text>
  <text x="698" y="222" class="text-label-strong mono" text-anchor="end">video/mp4</text>
  <rect x="13" y="242" width="194" height="60" rx="10" class="card-brand" />
  <text x="110" y="269" class="text-item-inverse" text-anchor="middle">episode 1</text>
  <text x="110" y="288" class="text-label-inverse mono" text-anchor="middle">2s</text>
  <text x="110" y="326" class="text-label" text-anchor="middle">closed by duration</text>
  <rect x="213" y="242" width="94" height="60" rx="10" class="card-brand" />
  <text x="260" y="269" class="text-item-inverse" text-anchor="middle">episode 2</text>
  <text x="260" y="288" class="text-label-inverse mono" text-anchor="middle">1s</text>
  <text x="260" y="326" class="text-label-strong" text-anchor="middle">closed by gap</text>
  <rect x="513" y="242" width="194" height="60" rx="10" class="card-brand" />
  <text x="610" y="269" class="text-item-inverse" text-anchor="middle">episode 3</text>
  <text x="610" y="288" class="text-label-inverse mono" text-anchor="middle">2s</text>
  <text x="610" y="326" class="text-label" text-anchor="middle">closed by duration</text>
  <text x="10" y="370" class="text-label mono" text-anchor="start">when={&quot;#ext&quot;: {&quot;video&quot;: {&quot;export&quot;: {&quot;duration&quot;: &quot;2s&quot;}}}}</text>
</svg>
