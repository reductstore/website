<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 758 188" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --card-stroke: #333333;
        --shadow: #000000;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
          --shadow: #000000;
          --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .shadow { fill: var(--shadow); }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="8" y="48" width="130" height="80" rx="16" class="shadow" />
  <rect x="0" y="40" width="130" height="80" rx="16" class="card-standard" />
  <text x="65" y="86" class="text-title" text-anchor="middle">Records</text>
  <rect x="188" y="48" width="160" height="80" rx="16" class="shadow" />
  <rect x="180" y="40" width="160" height="80" rx="16" class="card-brand" />
  <text x="260" y="86" class="text-title-inverse" text-anchor="middle">ReductStore</text>
  <rect x="398" y="8" width="170" height="160" rx="18" class="shadow" />
  <rect x="390" y="0" width="170" height="160" rx="18" class="card-standard" />
  <text x="475" y="32" class="text-title" text-anchor="middle">Blocks</text>
  <rect x="412" y="48" width="22" height="24" rx="2" class="record" />
  <rect x="438" y="48" width="22" height="24" rx="2" class="record" />
  <rect x="464" y="48" width="22" height="24" rx="2" class="record" />
  <rect x="490" y="48" width="22" height="24" rx="2" class="record" />
  <rect x="516" y="48" width="22" height="24" rx="2" class="record" />
  <rect x="412" y="82" width="22" height="24" rx="2" class="record" />
  <rect x="438" y="82" width="22" height="24" rx="2" class="record" />
  <rect x="464" y="82" width="22" height="24" rx="2" class="record" />
  <rect x="490" y="82" width="22" height="24" rx="2" class="record" />
  <rect x="516" y="82" width="22" height="24" rx="2" class="record" />
  <rect x="412" y="116" width="22" height="24" rx="2" class="record" />
  <rect x="438" y="116" width="22" height="24" rx="2" class="record" />
  <rect x="464" y="116" width="22" height="24" rx="2" class="record" />
  <rect x="490" y="116" width="22" height="24" rx="2" class="record" />
  <rect x="516" y="116" width="22" height="24" rx="2" class="record" />
  <rect x="618" y="48" width="120" height="80" rx="16" class="shadow" />
  <rect x="610" y="40" width="120" height="80" rx="16" class="card-standard" />
  <text x="670" y="86" class="text-title" text-anchor="middle">S3</text>
  <path d="M130,80 L176,80" class="connector" marker-end="url(#arrow)" />
  <path d="M340,80 L386,80" class="connector" marker-end="url(#arrow)" />
  <path d="M560,80 L606,80" class="connector" marker-end="url(#arrow)" />
</svg>
