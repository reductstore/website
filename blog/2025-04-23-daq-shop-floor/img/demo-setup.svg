<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 300" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="740" height="280" rx="18" class="zone" />
  <rect x="790" y="0" width="340" height="280" rx="18" class="zone" />
  <text x="18" y="26" class="text-zone" text-anchor="start">DAQ edge device</text>
  <rect x="20" y="108" width="150" height="70" rx="10" class="card-plain" />
  <text x="95" y="140" class="text-item" text-anchor="middle">Data source</text>
  <text x="95" y="159" class="text-label mono" text-anchor="middle">data_source.py</text>
  <rect x="210" y="50" width="300" height="206" rx="18" class="card-brand-frame" />
  <text x="230" y="82" class="text-title-brand" text-anchor="start">ReductStore</text>
  <text x="230" y="104" class="text-subtitle mono" text-anchor="start">bucket: data</text>
  <rect x="230" y="120" width="260" height="46" rx="8" class="card-plain" />
  <rect x="242.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="256.5" y="129" width="9" height="28" rx="2" class="record label-b" />
  <rect x="270.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="284.5" y="129" width="9" height="28" rx="2" class="record label-c" />
  <rect x="298.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="312.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="326.5" y="129" width="9" height="28" rx="2" class="record label-c" />
  <rect x="340.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="354.5" y="129" width="9" height="28" rx="2" class="record label-b" />
  <rect x="368.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <text x="478" y="148" class="text-label-strong" text-anchor="end">scored_data</text>
  <text x="232" y="202" class="text-label" text-anchor="start">• FIFO quota, 1GB</text>
  <text x="232" y="226" class="text-label" text-anchor="start">• Replication task: repl-task</text>
  <rect x="550" y="108" width="170" height="70" rx="10" class="card-accent" />
  <text x="635" y="140" class="text-item-inverse" text-anchor="middle">Replication</text>
  <text x="635" y="159" class="text-label-inverse mono" text-anchor="middle">&amp;score &gt; 0.8</text>
  <text x="808" y="26" class="text-zone" text-anchor="start">Demo server</text>
  <rect x="810" y="50" width="300" height="206" rx="18" class="card-brand-frame" />
  <text x="830" y="82" class="text-title-brand" text-anchor="start">ReductStore</text>
  <text x="830" y="104" class="text-subtitle mono" text-anchor="start">bucket: demo</text>
  <rect x="830" y="120" width="260" height="46" rx="8" class="card-plain" />
  <rect x="842.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="856.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="870.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="884.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="898.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="912.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="926.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="940.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="954.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <rect x="968.5" y="129" width="9" height="28" rx="2" class="record label-a" />
  <text x="1078" y="148" class="text-label-strong" text-anchor="end">scored_data</text>
  <text x="832" y="202" class="text-label mono" text-anchor="start">play.reduct.store</text>
  <path d="M170,143 L226,143" class="connector" marker-end="url(#arrow)" />
  <path d="M490,143 L546,143" class="connector" marker-end="url(#arrow)" />
  <path d="M720,143 L826,143" class="connector" marker-end="url(#arrow)" />
</svg>
