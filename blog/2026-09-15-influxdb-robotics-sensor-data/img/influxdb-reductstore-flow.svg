<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 10 628 470" width="100%" height="100%">
<defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --card-stroke: #333333;
        --shadow: #000000;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
          --shadow: #000000;
          --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .shadow { fill: var(--shadow); }

      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>
<rect x="168.0" y="28" width="280" height="80" rx="16" class="shadow" />
<rect x="160.0" y="20" width="280" height="80" rx="16" class="card-standard" />
<text x="300.0" y="54.0" class="text-title" text-anchor="middle">Robot sensors</text>
<text x="300.0" y="78.0" class="text-subtitle mono" text-anchor="middle">camera, LiDAR, waveform</text>
<path d="M300.0,100 L300.0,146" class="connector" marker-end="url(#arrow)" />
<rect x="168.0" y="158" width="280" height="80" rx="16" class="shadow" />
<rect x="160.0" y="150" width="280" height="80" rx="16" class="card-standard" />
<text x="300.0" y="184.0" class="text-title" text-anchor="middle">Processing and fan-out</text>
<text x="300.0" y="208.0" class="text-subtitle mono" text-anchor="middle">event time + stable IDs</text>
<path d="M300.0,230 L300.0,262 M135.0,262 L465.0,262" class="connector" />
<path d="M135.0,262 L135.0,326" class="connector" marker-end="url(#arrow)" />
<path d="M465.0,262 L465.0,326" class="connector" marker-end="url(#arrow)" />
<text x="145.0" y="292" class="text-label mono" text-anchor="start">numeric metrics</text>
<text x="455.0" y="292" class="text-label-strong mono" text-anchor="end">raw binary payloads</text>
<rect x="8" y="338" width="270" height="80" rx="16" class="shadow" />
<rect x="0" y="330" width="270" height="80" rx="16" class="card-standard" />
<text x="135.0" y="364.0" class="text-title" text-anchor="middle">InfluxDB</text>
<text x="135.0" y="388.0" class="text-subtitle mono" text-anchor="middle">metrics, dashboards, alerts</text>
<rect x="338" y="338" width="270" height="80" rx="16" class="shadow" />
<rect x="330" y="330" width="270" height="80" rx="16" class="card-brand" />
<text x="465.0" y="364.0" class="text-title-inverse" text-anchor="middle">ReductStore</text>
<text x="465.0" y="388.0" class="text-subtitle-inverse mono" text-anchor="middle">frames, scans, chunks</text>
<path d="M135.0,422 L135.0,446 L465.0,446 L465.0,422" class="link" />
<text x="300.0" y="470" class="text-label mono" text-anchor="middle">same event time, robot_id, sensor_id</text>
</svg>
