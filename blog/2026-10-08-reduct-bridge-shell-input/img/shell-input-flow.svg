<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 370" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="160" height="170" rx="18" class="zone" />
  <rect x="190" y="0" width="550" height="350" rx="18" class="zone" />
  <text x="18" y="26" class="text-zone" text-anchor="start">Legacy machine</text>
  <rect x="15" y="60" width="130" height="70" rx="10" class="card-plain" />
  <text x="80" y="92" class="text-item" text-anchor="middle">Vendor tool</text>
  <text x="80" y="111" class="text-label mono" text-anchor="middle">status output</text>
  <text x="208" y="26" class="text-zone" text-anchor="start">Edge device</text>
  <rect x="215" y="60" width="140" height="70" rx="10" class="card-plain" />
  <text x="285" y="92" class="text-item" text-anchor="middle">Shell script</text>
  <text x="285" y="111" class="text-label mono" text-anchor="middle">chamber-status</text>
  <rect x="405" y="60" width="160" height="70" rx="10" class="card-accent" />
  <text x="485" y="92" class="text-item-inverse" text-anchor="middle">Reduct Bridge</text>
  <text x="485" y="111" class="text-label-inverse mono" text-anchor="middle">shell input</text>
  <rect x="215" y="180" width="500" height="145" rx="18" class="card-brand-frame" />
  <text x="235" y="212" class="text-title-brand" text-anchor="start">ReductStore</text>
  <rect x="235" y="230" width="170" height="60" rx="10" class="card-plain" />
  <text x="320" y="265" class="text-item" text-anchor="middle">factory-data</text>
  <text x="440" y="245" class="text-item mono" text-anchor="start">chamber-01/status</text>
  <rect x="478.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="492.5" y="260" width="9" height="24" rx="2" class="record label-b" />
  <rect x="506.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="520.5" y="260" width="9" height="24" rx="2" class="record label-c" />
  <rect x="534.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="548.5" y="260" width="9" height="24" rx="2" class="record label-b" />
  <rect x="562.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="576.5" y="260" width="9" height="24" rx="2" class="record label-c" />
  <rect x="590.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="604.5" y="260" width="9" height="24" rx="2" class="record label-b" />
  <rect x="618.5" y="260" width="9" height="24" rx="2" class="record label-a" />
  <rect x="632.5" y="260" width="9" height="24" rx="2" class="record label-c" />
  <text x="440" y="310" class="text-label mono" text-anchor="start">time-indexed records</text>
  <path d="M145,95 L211,95" class="connector" marker-end="url(#arrow)" />
  <text x="177" y="150" class="text-label mono" text-anchor="middle">SSH / serial</text>
  <path d="M355,95 L401,95" class="connector" marker-end="url(#arrow)" />
  <text x="378" y="76" class="text-label mono" text-anchor="middle">stdout</text>
  <path d="M485,130 L485,176" class="connector" marker-end="url(#arrow)" />
</svg>
