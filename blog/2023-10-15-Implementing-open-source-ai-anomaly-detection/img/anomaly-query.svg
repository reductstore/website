<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 641.3 396" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-brand: #2B0548;
        --brand-line: #2B0548;
        --card-accent: #DB817B;
        --card-stroke: #333333;
        --text-main: #333333;
        --text-muted: #666666;
        --text-inverse: #FFFFFF;
        --line: #333333;
        --zone: #F7F4FA;
        --label-a: #D5E8D4;
        --label-a-stroke: #82B366;
        --label-b: #E1D5E7;
        --label-b-stroke: #9673A6;
        --label-c: #F8CECC;
        --label-c-stroke: #B85450;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1E1E1E;
          --card-stroke: #555555;
            --text-main: #EFEFEF;
          --text-muted: #A0A0A0;
          --line: #EFEFEF;
          --zone: #262129;
          --brand-line: #BFA6DC;
        }
      }

      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        white-space: pre;
      }

      .card-standard { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand { fill: var(--card-brand); stroke: var(--card-stroke); stroke-width: 2; }
      .card-brand-frame { fill: var(--card-bg); stroke: var(--brand-line); stroke-width: 2; }
      .card-accent { fill: var(--card-accent); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-plain { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1.5; }
      .zone { fill: var(--zone); stroke: var(--card-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .hatch { fill: url(#hatch); stroke: var(--card-stroke); stroke-width: 1.5; }
      .hatch-line { stroke: var(--line); stroke-width: 1.5; }
      .record { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 1; }
      .label-a { fill: var(--label-a); stroke: var(--label-a-stroke); }
      .label-b { fill: var(--label-b); stroke: var(--label-b-stroke); }
      .label-c { fill: var(--label-c); stroke: var(--label-c-stroke); }
      .dot { fill: var(--text-muted); }

      .text-zone { font-weight: 700; font-size: 15px; fill: var(--text-main); }
      .text-title { font-weight: 600; font-size: 18px; fill: var(--text-main); }
      .text-title-inverse { font-weight: 600; font-size: 18px; fill: var(--text-inverse); }
      .text-title-brand { font-weight: 700; font-size: 18px; fill: var(--brand-line); }
      .text-item-brand { font-weight: 700; font-size: 15px; fill: var(--brand-line); }
      .text-item { font-weight: 600; font-size: 15px; fill: var(--text-main); }
      .text-item-inverse { font-weight: 600; font-size: 15px; fill: var(--text-inverse); }
      .text-subtitle { font-size: 14px; fill: var(--text-muted); }
      .text-subtitle-inverse { font-size: 14px; fill: var(--text-inverse); }
      .text-bullet { font-size: 15px; fill: var(--text-main); }
      .text-bullet-inverse { font-size: 15px; fill: var(--text-inverse); }
      .text-label { font-size: 13px; fill: var(--text-muted); }
      .text-label-strong { font-size: 13px; font-weight: 700; fill: var(--text-main); }
      .text-label-inverse { font-size: 13px; fill: var(--text-inverse); }
      .text-note { font-size: 13px; font-style: italic; fill: var(--text-muted); }

      .connector { stroke: var(--line); stroke-width: 2; fill: none; }
      .link { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
      .guide { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .arrow-head { fill: var(--line); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-line" />
    </pattern>
  </defs>
  <rect x="40" y="236" width="330" height="140" rx="18" class="zone" />
  <rect x="410" y="236" width="190" height="140" rx="18" class="zone" />
  <rect x="0" y="0" width="600" height="170" rx="18" class="card-brand-frame" />
  <text x="300" y="32" class="text-title-brand" text-anchor="middle">ReductStore</text>
  <text x="30" y="92" class="text-label-strong mono" text-anchor="start">camera-1</text>
  <rect x="278.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="292.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="306.5" y="70" width="9" height="42" rx="2" class="record label-c" />
  <rect x="320.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="334.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="348.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="362.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="376.5" y="70" width="9" height="42" rx="2" class="record label-c" />
  <rect x="390.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="404.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <rect x="418.5" y="70" width="9" height="42" rx="2" class="record label-c" />
  <rect x="432.5" y="70" width="9" height="42" rx="2" class="record label-a" />
  <text x="150" y="132" class="text-label" text-anchor="start">each record: image + anomaly_score, anomaly, model</text>
  <path d="M150,150 L545,150" class="connector" marker-end="url(#arrow)" />
  <text x="551" y="154" class="text-note" text-anchor="start">time</text>
  <path d="M205,170 L205,224" class="connector" marker-end="url(#arrow)" />
  <text x="218" y="198" class="text-label-strong" text-anchor="start">query</text>
  <text x="218" y="216" class="text-note mono" text-anchor="start">when &amp;anomaly_score $gt 0.7</text>
  <text x="58" y="262" class="text-zone" text-anchor="start">matching frames</text>
  <rect x="186.5" y="288" width="9" height="36" rx="2" class="record label-c" />
  <rect x="200.5" y="288" width="9" height="36" rx="2" class="record label-c" />
  <rect x="214.5" y="288" width="9" height="36" rx="2" class="record label-c" />
  <text x="72" y="352" class="text-label" text-anchor="start">the same records, image and labels</text>
  <path d="M500,170 L500,224" class="connector" marker-end="url(#arrow)" />
  <text x="513" y="198" class="text-label-strong" text-anchor="start">head read</text>
  <text x="428" y="262" class="text-zone" text-anchor="start">labels only</text>
  <text x="432" y="290" class="text-label mono" text-anchor="start">anomaly_score</text>
  <text x="432" y="312" class="text-label mono" text-anchor="start">anomaly</text>
  <text x="432" y="334" class="text-label mono" text-anchor="start">model</text>
  <text x="432" y="360" class="text-note" text-anchor="start">payloads stay in the store</text>
</svg>
